server {
    listen 8080;
    server_name localhost;

    # 1. Health Check for K8s Probes
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # 2. Product Catalog & Admin & Checkout (Port 8081)

    # GET /api/products
    location /api/products {
        # Deal with CORS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            return 204; # Successful (empty response body)
        }
        add_header 'Access-Control-Allow-Origin' '*' always;

        proxy_pass http://product-catalog:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # POST, PUT, DELETE /api/admin/products
    location /api/admin/products {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;

        proxy_pass http://product-catalog:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # POST /api/checkout
    location /api/checkout {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;

        proxy_pass http://product-catalog:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Delivery Service (Port 8083)

    # GET /api/delivery/<ORD-1001>
    # PATCH /api/delivery/<ORD-1001>/status
    # GET /api/delivery (watch all delivery orders)
    location /api/delivery {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;

        rewrite ^/api/delivery/?(.*)$ /deliveries/$1 break;

        proxy_pass http://delivery-service:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
