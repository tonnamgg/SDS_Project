# Run the whole shop locally:
#   1. Copy .env.example to .env and fill it in
#   2. Put credentials.json in this folder
#   3. docker compose up --build
#   4. Open http://localhost:3000

services:
  product-catalog:
    build: ./product-catalog
    ports:
      - "8081:8081"
    environment:
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:?Set GOOGLE_SHEETS_SPREADSHEET_ID in .env}
      GOOGLE_SHEETS_TAB_NAME: ${CATALOG_SHEET_TAB:-Sheet1}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
    volumes:
      - ./credentials.json:/app/credentials.json:ro

  payment:
    build: ./payment
    ports:
      - "8082:8082"
    environment:
      PRODUCT_CATALOG_URL: http://product-catalog:8081
      DELIVERY_SERVICE_URL: http://delivery-service:8083
    depends_on:
      - product-catalog
      - delivery-service
    networks:
      default:
        # The API Gateway proxies payment requests to this hostname.
        aliases:
          - payment-service

  delivery-service:
    build: ./delivery-service
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:?Set GOOGLE_SHEETS_SPREADSHEET_ID in .env}
      GOOGLE_SHEETS_TAB_NAME: ${DELIVERY_SHEET_TAB:-Deliveries}
      GOOGLE_APPLICATION_CREDENTIALS: /var/secrets/google/credentials.json
    volumes:
      - ./credentials.json:/var/secrets/google/credentials.json:ro

  # nginx resolves upstream hostnames at startup, so the backends must exist first.
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - product-catalog
      - payment
      - delivery-service

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
